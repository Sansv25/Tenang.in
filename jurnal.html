<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tenang.in Ruang Jurnal — Tulis refleksi harianmu dengan prompt yang dipersonalisasi berdasarkan mood.">
  <meta name="theme-color" content="#3B72C4">
  <title>Ruang Jurnal — Tenang.in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Lexend:wght@300;400;500;600;700;800&family=Urbanist:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
  <div class="page-wrapper">
    <div class="container container-md">

      <!-- Header -->
      <section style="padding:var(--space-xl) 0;">
        <h1 style="font-size:var(--h2-size); font-weight:700; display:flex; align-items:center; gap:10px;">
          <span class="material-symbols-rounded text-primary" style="font-size:32px;">edit_note</span>
          <span>Ruang Jurnal</span>
        </h1>
        <p style="color:rgba(255,255,255,0.75); margin-top:var(--space-xs);">Tulis, refleksi, dan lepaskan</p>
      </section>

      <!-- Daily Prompt -->
      <section id="jurnal-prompt">
        <!-- Filled by JS -->
      </section>

      <!-- Writing Area -->
      <section style="margin-top:var(--space-lg);">
        <div class="card" style="padding:var(--space-xl);">
          <h3 style="font-weight:700; margin-bottom:var(--space-md); color:var(--text-on-white);">Tuliskan perasaanmu...</h3>
          <textarea id="jurnal-content" class="input textarea" placeholder="Mulai menulis di sini. Jujur sama dirimu sendiri — ini ruang amanmu..." style="min-height:160px;"></textarea>
          <div class="char-counter" id="char-counter">0 karakter</div>

          <!-- Tags -->
          <div style="margin-top:var(--space-lg);">
            <p style="font-size:0.875rem; font-weight:600; color:var(--text-secondary); margin-bottom:var(--space-sm);">Mood saat menulis</p>
            <div class="tag-container" id="jurnal-tags">
              <button class="tag-chip" onclick="toggleJurnalTag('senang', this)">Senang</button>
              <button class="tag-chip" onclick="toggleJurnalTag('sedih', this)">Sedih</button>
              <button class="tag-chip" onclick="toggleJurnalTag('cemas', this)">Cemas</button>
              <button class="tag-chip" onclick="toggleJurnalTag('lega', this)">Lega</button>
              <button class="tag-chip" onclick="toggleJurnalTag('bersyukur', this)">Bersyukur</button>
              <button class="tag-chip" onclick="toggleJurnalTag('bingung', this)">Bingung</button>
            </div>
          </div>

          <button class="btn btn-primary btn-full" style="margin-top:var(--space-xl);" onclick="saveJurnal()">
            <span class="material-symbols-rounded">save</span>
            Simpan Jurnal
          </button>
        </div>
      </section>

      <!-- Journal History -->
      <section style="margin-top:var(--space-2xl); padding-bottom:var(--space-xl);">
        <h2 style="font-size:var(--h3-size); font-weight:600; margin-bottom:var(--space-md); color:var(--text-on-blue); display:flex; align-items:center; gap:8px;">
          <span class="material-symbols-rounded" style="font-size:22px;">auto_stories</span>
          <span>Riwayat Jurnal</span>
        </h2>
        <div id="jurnal-list" style="display:flex; flex-direction:column; gap:var(--space-md);">
          <!-- Filled by JS -->
        </div>
      </section>

    </div>
  </div>

  <!-- Read Journal Modal -->
  <div class="modal-overlay" id="jurnal-read-modal">
    <div class="modal" style="max-width:560px;">
      <div class="modal-header">
        <div>
          <span class="journal-date" id="jurnal-read-date"></span>
        </div>
        <button class="modal-close" onclick="closeJurnalModal()"><span class="material-symbols-rounded">close</span></button>
      </div>
      <p id="jurnal-read-prompt" style="font-size:0.8125rem; color:var(--primary-accent); font-style:italic; margin-bottom:var(--space-md);"></p>
      <p id="jurnal-read-content" style="font-size:var(--body-size); line-height:1.8; color:var(--text-on-white); white-space:pre-wrap;"></p>
      <div class="journal-tags" id="jurnal-read-tags" style="margin-top:var(--space-lg);"></div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal-overlay" id="delete-confirm-modal">
    <div class="modal" style="max-width:400px;">
      <div class="confirm-dialog">
        <div class="confirm-dialog-icon">
          <span class="material-symbols-rounded text-danger" style="font-size:48px;">delete</span>
        </div>
        <h3 class="confirm-dialog-title" style="color:var(--text-on-white);">Hapus Jurnal?</h3>
        <p class="confirm-dialog-text">Jurnal yang dihapus tidak bisa dikembalikan.</p>
        <div class="confirm-dialog-actions">
          <button class="btn btn-ghost" style="color:var(--text-secondary);" onclick="cancelDelete()">Batal</button>
          <button class="btn btn-danger" onclick="executeDelete()">Hapus</button>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/storage.js"></script>
  <script src="assets/js/animations.js"></script>
  <script src="assets/js/charts.js"></script>
  <script src="assets/js/teman-chat.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/jurnal.js"></script>
</body>
</html>
